# Production (the VPS). Run through deploy/server-deploy.sh, which pulls the latest commits and rebuilds:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Settings and secrets live in .env.production on the server (never committed; created by server-deploy.sh).
name: mrac-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: mrac
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrac"]
      interval: 5s
      retries: 20
    # not published: only the app reaches the database

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mrac:${POSTGRES_PASSWORD}@db:5432/mrac?schema=public
      BETTER_AUTH_URL: ${PUBLIC_URL:?set in .env.production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env.production}
      PAYMENT_SECRETS_KEY: ${PAYMENT_SECRETS_KEY:-}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:?set in .env.production}:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
